name: Update generated files

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6
      - run: ruby tools/convert-shared-credential-to-legacy-format.rb
      - name: Commit and push updated files
        uses: stefanzweifel/git-auto-commit-action@3ea6ae190baf489ba007f7c92608f33ce20ef04a  # v4.16.0
        with:
          file_pattern: 'quirks/*.json'
          commit_message: Update generated files
      - run: gh api repos/{owner}/{repo}/actions/workflows/lint.yml/dispatches --field ref={branch}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
