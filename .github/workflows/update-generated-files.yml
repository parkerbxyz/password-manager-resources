name: Update generated files

on:
  pull_request:
    branches: [main]
    paths:
      [
        "quirks/shared-credentials.json",
        "quirks/shared-credentials-historical.json",
      ]

jobs:
  update-generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
      - run: ruby tools/convert-shared-credential-to-legacy-format.rb
      - uses: parkerbxyz/suggest-changes@15517a158b6ab10e92bef05860c122c2a57da497 # v1.0.1
        with:
          comment: "Please commit the suggested changes to update the generated files."
